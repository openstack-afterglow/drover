name: Staging Gate

on:
  workflow_dispatch:
    inputs:
      enable_staging:
        description: 'Force run staging gate integration tests'
        required: false
        type: boolean
        default: true
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, dev]

permissions:
  contents: read

jobs:
  staging-gate:
    name: Kolla Deployment & Integration Test Gate
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python and uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Assert required staging gate secrets and environment contract
        env:
          DROVER_INTEGRATION_CLOUD: ${{ secrets.DROVER_INTEGRATION_CLOUD }}
          OS_AUTH_URL: ${{ secrets.OS_AUTH_URL }}
          OS_USERNAME: ${{ secrets.OS_USERNAME }}
          OS_PASSWORD: ${{ secrets.OS_PASSWORD }}
          OS_PROJECT_NAME: ${{ secrets.OS_PROJECT_NAME }}
          OS_PROJECT_ID: ${{ secrets.OS_PROJECT_ID }}
          DROVER_INTEGRATION_NETWORK_ID: ${{ secrets.DROVER_INTEGRATION_NETWORK_ID }}
          DROVER_INTEGRATION_IMAGE_ID: ${{ secrets.DROVER_INTEGRATION_IMAGE_ID }}
          DROVER_INTEGRATION_FLAVOR_ID: ${{ secrets.DROVER_INTEGRATION_FLAVOR_ID }}
          SERVICE_DROVER_INTERNAL_URL: ${{ secrets.SERVICE_DROVER_INTERNAL_URL }}
          DROVER_API_URL: ${{ secrets.DROVER_API_URL }}
        run: |
          uv run python -c "
          import os, sys

          req_vars = {
              'DROVER_INTEGRATION_CLOUD': os.environ.get('DROVER_INTEGRATION_CLOUD'),
              'OS_AUTH_URL': os.environ.get('OS_AUTH_URL'),
              'OS_USERNAME': os.environ.get('OS_USERNAME'),
              'OS_PASSWORD': os.environ.get('OS_PASSWORD'),
              'OS_PROJECT_NAME or OS_PROJECT_ID': os.environ.get('OS_PROJECT_NAME') or os.environ.get('OS_PROJECT_ID'),
              'DROVER_INTEGRATION_NETWORK_ID': os.environ.get('DROVER_INTEGRATION_NETWORK_ID'),
              'DROVER_INTEGRATION_IMAGE_ID': os.environ.get('DROVER_INTEGRATION_IMAGE_ID'),
              'DROVER_INTEGRATION_FLAVOR_ID': os.environ.get('DROVER_INTEGRATION_FLAVOR_ID'),
              'SERVICE_DROVER_INTERNAL_URL or DROVER_API_URL': os.environ.get('SERVICE_DROVER_INTERNAL_URL') or os.environ.get('DROVER_API_URL'),
          }

          missing = [k for k, v in req_vars.items() if not v or (k == 'DROVER_INTEGRATION_CLOUD' and v not in ('1', 'true', 'yes'))]
          if missing:
              print('========================================================================')
              print('STAGING GATE FAILURE: Missing required secrets or environment contract.')
              print('The following credentials/environment variables are missing or disabled:')
              for item in missing:
                  print(f'  - {item}')
              print('========================================================================')
              print('Do not fake cloud deployment. Staging gate requires explicit staging environment.')
              sys.exit(1)
          else:
              print('Staging environment contract verified.')
          "

      - name: Deploy Kolla role assets
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          uv run python -c "
          import os, yaml
          from pathlib import Path

          kolla_dir = Path('deploy/kolla')
          assert (kolla_dir / 'tasks' / 'main.yml').exists(), 'Kolla main task missing'
          assert (kolla_dir / 'defaults' / 'main.yml').exists(), 'Kolla defaults missing'

          # Validate Kolla role defaults structure
          defaults = yaml.safe_load((kolla_dir / 'defaults' / 'main.yml').read_text())
          assert defaults.get('drover_keystone_service_name') == 'drover'
          assert defaults.get('drover_keystone_service_type') == 'container-infra'

          print('Deploying Kolla role assets...')
          "

      - name: Assert Keystone catalog endpoint discovery for /v1
        env:
          OS_AUTH_URL: ${{ secrets.OS_AUTH_URL }}
          OS_USERNAME: ${{ secrets.OS_USERNAME }}
          OS_PASSWORD: ${{ secrets.OS_PASSWORD }}
          OS_PROJECT_NAME: ${{ secrets.OS_PROJECT_NAME }}
          OS_PROJECT_ID: ${{ secrets.OS_PROJECT_ID }}
          SERVICE_DROVER_INTERNAL_URL: ${{ secrets.SERVICE_DROVER_INTERNAL_URL }}
          DROVER_API_URL: ${{ secrets.DROVER_API_URL }}
        run: |
          uv run python -c "
          import os, openstack

          auth_url = os.environ.get('OS_AUTH_URL')
          username = os.environ.get('OS_USERNAME')
          password = os.environ.get('OS_PASSWORD')
          project_name = os.environ.get('OS_PROJECT_NAME')
          project_id = os.environ.get('OS_PROJECT_ID')

          conn = openstack.connect(
              auth_url=auth_url,
              username=username,
              password=password,
              project_name=project_name,
              project_id=project_id,
              user_domain_name='Default',
              project_domain_name='Default',
          )

          # Find container-infra service in Keystone catalog
          services = list(conn.identity.services(type='container-infra'))
          drover_svc = next((s for s in services if s.name == 'drover'), None)
          assert drover_svc is not None, 'Drover container-infra service not registered in Keystone'

          endpoints = list(conn.identity.endpoints(service_id=drover_svc.id))
          assert len(endpoints) > 0, 'No endpoints registered for Drover service in Keystone'

          for ep in endpoints:
              assert ep.url.endswith('/v1'), f'Keystone catalog endpoint URL {ep.url} does not end with /v1'

          print('Keystone catalog endpoint discovery verified successfully.')
          "

      - name: Execute live OpenStack integration test suite
        env:
          DROVER_INTEGRATION_CLOUD: "1"
          OS_AUTH_URL: ${{ secrets.OS_AUTH_URL }}
          OS_USERNAME: ${{ secrets.OS_USERNAME }}
          OS_PASSWORD: ${{ secrets.OS_PASSWORD }}
          OS_PROJECT_NAME: ${{ secrets.OS_PROJECT_NAME }}
          OS_PROJECT_ID: ${{ secrets.OS_PROJECT_ID }}
          DROVER_INTEGRATION_NETWORK_ID: ${{ secrets.DROVER_INTEGRATION_NETWORK_ID }}
          DROVER_INTEGRATION_IMAGE_ID: ${{ secrets.DROVER_INTEGRATION_IMAGE_ID }}
          DROVER_INTEGRATION_FLAVOR_ID: ${{ secrets.DROVER_INTEGRATION_FLAVOR_ID }}
          SERVICE_DROVER_INTERNAL_URL: ${{ secrets.SERVICE_DROVER_INTERNAL_URL }}
          DROVER_API_URL: ${{ secrets.DROVER_API_URL }}
        run: uv run pytest tests/integration
