name: Manual Live OpenStack Gate

on:
  workflow_dispatch:

permissions:
  contents: read


concurrency:
  group: drover-staging-gate
  cancel-in-progress: false
jobs:
  staging-gate:
    name: Live OpenStack Integration Gate
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 90
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Setup Python and uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Assert required staging gate secrets and environment contract
        env:
          DROVER_INTEGRATION_CLOUD: "1"
          OS_AUTH_URL: ${{ secrets.OS_AUTH_URL }}
          OS_USERNAME: ${{ secrets.OS_USERNAME }}
          OS_PASSWORD: ${{ secrets.OS_PASSWORD }}
          OS_PROJECT_NAME: ${{ secrets.OS_PROJECT_NAME }}
          OS_PROJECT_ID: ${{ secrets.OS_PROJECT_ID }}
          DROVER_INTEGRATION_NETWORK_ID: ${{ secrets.DROVER_INTEGRATION_NETWORK_ID }}
          DROVER_INTEGRATION_SUBNET_ID: ${{ secrets.DROVER_INTEGRATION_SUBNET_ID }}
          DROVER_INTEGRATION_IMAGE_ID: ${{ secrets.DROVER_INTEGRATION_IMAGE_ID }}
          DROVER_INTEGRATION_FLAVOR_ID: ${{ secrets.DROVER_INTEGRATION_FLAVOR_ID }}
          DROVER_INTEGRATION_EXTERNAL_NET_ID: ${{ secrets.DROVER_INTEGRATION_EXTERNAL_NET_ID }}
          DROVER_INTEGRATION_VOLUME_AZ: ${{ vars.DROVER_INTEGRATION_VOLUME_AZ }}
          DROVER_API_URL: ${{ vars.DROVER_API_URL }}
        run: |
          uv run python -c "
          import os, sys
          from urllib.parse import urlparse

          req_vars = {
              'OS_AUTH_URL': os.environ.get('OS_AUTH_URL'),
              'OS_USERNAME': os.environ.get('OS_USERNAME'),
              'OS_PASSWORD': os.environ.get('OS_PASSWORD'),
              'OS_PROJECT_NAME or OS_PROJECT_ID': os.environ.get('OS_PROJECT_NAME') or os.environ.get('OS_PROJECT_ID'),
              'DROVER_INTEGRATION_NETWORK_ID': os.environ.get('DROVER_INTEGRATION_NETWORK_ID'),
              'DROVER_INTEGRATION_SUBNET_ID': os.environ.get('DROVER_INTEGRATION_SUBNET_ID'),
              'DROVER_INTEGRATION_IMAGE_ID': os.environ.get('DROVER_INTEGRATION_IMAGE_ID'),
              'DROVER_INTEGRATION_FLAVOR_ID': os.environ.get('DROVER_INTEGRATION_FLAVOR_ID'),
              'DROVER_INTEGRATION_EXTERNAL_NET_ID': os.environ.get('DROVER_INTEGRATION_EXTERNAL_NET_ID'),
              'DROVER_INTEGRATION_VOLUME_AZ': os.environ.get('DROVER_INTEGRATION_VOLUME_AZ'),
              'DROVER_API_URL': os.environ.get('DROVER_API_URL'),
          }

          missing = [key for key, value in req_vars.items() if not value]
          insecure_urls = [
              key
              for key in ('OS_AUTH_URL', 'DROVER_API_URL')
              if req_vars.get(key) and urlparse(req_vars[key]).scheme != 'https'
          ]
          if missing or insecure_urls:
              print('========================================================================')
              print('STAGING GATE FAILURE: Invalid staging environment contract.')
              for item in missing:
                  print(f'  - missing: {item}')
              for item in insecure_urls:
                  print(f'  - HTTPS required: {item}')
              print('========================================================================')
              print('Do not fake cloud deployment. Staging requires isolated, reachable live resources.')
              sys.exit(1)

          print('Staging environment contract verified.')
          "

      - name: Validate packaged Kolla role assets
        run: |
          uv run python -c "
          import yaml
          from pathlib import Path

          kolla_dir = Path('deploy/kolla')
          assert (kolla_dir / 'tasks' / 'main.yml').exists(), 'Kolla main task missing'
          assert (kolla_dir / 'defaults' / 'main.yml').exists(), 'Kolla defaults missing'

          defaults = yaml.safe_load((kolla_dir / 'defaults' / 'main.yml').read_text())
          assert defaults.get('drover_keystone_service_name') == 'drover'
          print('Packaged Kolla role assets validated; live deployment is verified separately.')
          "

      - name: Assert live Drover catalog and liveness
        env:
          OS_AUTH_URL: ${{ secrets.OS_AUTH_URL }}
          OS_USERNAME: ${{ secrets.OS_USERNAME }}
          OS_PASSWORD: ${{ secrets.OS_PASSWORD }}
          OS_PROJECT_NAME: ${{ secrets.OS_PROJECT_NAME }}
          OS_PROJECT_ID: ${{ secrets.OS_PROJECT_ID }}
          OS_USER_DOMAIN_NAME: ${{ vars.OS_USER_DOMAIN_NAME || 'Default' }}
          OS_PROJECT_DOMAIN_NAME: ${{ vars.OS_PROJECT_DOMAIN_NAME || 'Default' }}
          OS_REGION_NAME: ${{ vars.OS_REGION_NAME || 'RegionOne' }}
          DROVER_API_URL: ${{ vars.DROVER_API_URL }}
        run: |
          uv run python -c "
          import os, openstack
          from urllib.request import urlopen

          conn = openstack.connect(
              auth_url=os.environ['OS_AUTH_URL'],
              username=os.environ['OS_USERNAME'],
              password=os.environ['OS_PASSWORD'],
              project_name=os.environ.get('OS_PROJECT_NAME') or None,
              project_id=os.environ.get('OS_PROJECT_ID') or None,
              user_domain_name=os.environ['OS_USER_DOMAIN_NAME'],
              project_domain_name=os.environ['OS_PROJECT_DOMAIN_NAME'],
              region_name=os.environ['OS_REGION_NAME'],
          )

          services = list(conn.identity.services(type='drover'))
          drover_svc = next((service for service in services if service.name == 'drover'), None)
          assert drover_svc is not None, 'Drover service type drover is not registered in Keystone'

          endpoints = list(conn.identity.endpoints(service_id=drover_svc.id))
          expected_public_url = os.environ['DROVER_API_URL'].rstrip('/')
          assert any(
              endpoint.interface == 'public' and endpoint.url.rstrip('/') == expected_public_url
              for endpoint in endpoints
          ), 'Drover public catalog endpoint does not match DROVER_API_URL'

          with urlopen(f'{expected_public_url}/v1/health/live', timeout=10) as response:
              assert response.status == 200

          print('Live Drover catalog and liveness verified.')
          "

      - name: Execute live OpenStack integration test suite
        env:
          DROVER_INTEGRATION_CLOUD: "1"
          OS_AUTH_URL: ${{ secrets.OS_AUTH_URL }}
          OS_USERNAME: ${{ secrets.OS_USERNAME }}
          OS_PASSWORD: ${{ secrets.OS_PASSWORD }}
          OS_PROJECT_NAME: ${{ secrets.OS_PROJECT_NAME }}
          OS_PROJECT_ID: ${{ secrets.OS_PROJECT_ID }}
          OS_USER_DOMAIN_NAME: ${{ vars.OS_USER_DOMAIN_NAME || 'Default' }}
          OS_PROJECT_DOMAIN_NAME: ${{ vars.OS_PROJECT_DOMAIN_NAME || 'Default' }}
          OS_REGION_NAME: ${{ vars.OS_REGION_NAME || 'RegionOne' }}
          DROVER_INTEGRATION_NETWORK_ID: ${{ secrets.DROVER_INTEGRATION_NETWORK_ID }}
          DROVER_INTEGRATION_SUBNET_ID: ${{ secrets.DROVER_INTEGRATION_SUBNET_ID }}
          DROVER_INTEGRATION_IMAGE_ID: ${{ secrets.DROVER_INTEGRATION_IMAGE_ID }}
          DROVER_INTEGRATION_FLAVOR_ID: ${{ secrets.DROVER_INTEGRATION_FLAVOR_ID }}
          DROVER_INTEGRATION_EXTERNAL_NET_ID: ${{ secrets.DROVER_INTEGRATION_EXTERNAL_NET_ID }}
          DROVER_INTEGRATION_VOLUME_AZ: ${{ vars.DROVER_INTEGRATION_VOLUME_AZ }}
          DROVER_API_URL: ${{ vars.DROVER_API_URL }}
        run: uv run pytest tests/integration -v
