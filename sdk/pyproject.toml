[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drover-sdk"
version = "0.2.8"
description = "OpenStack SDK extension for the Drover API"
requires-python = ">=3.12"
dependencies = [
    "openstacksdk>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "responses>=0.25",
    "ruff>=0.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["drover_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
