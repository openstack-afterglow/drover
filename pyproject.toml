[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drover"
version = "0.2.25"
description = "OpenStack-native K3s Kubernetes control plane service"
requires-python = ">=3.11"

[project.optional-dependencies]
service = [
    "afterglow-crypto @ git+https://github.com/openstack-afterglow/afterglow-crypto.git@65ff43db4d386d65436411fc0642ebc3044bd517",
    "fastapi==0.141.1",
    "starlette>=1.3.1",
    "uvicorn[standard]==0.39.0",
    "openstacksdk==3.3.0",
    "keystoneauth1>=5.12.0",
    "python-keystoneclient==5.4.0",
    "oslo.policy>=4.0.0",
    "jinja2==3.1.6",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "redis[hiredis]==5.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiomysql>=0.2.0",
    "slowapi>=0.1.9",
    "pyyaml>=6.0",
    "websockets>=12.0",
    "httpx>=0.28.1",
]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "fakeredis[lua]>=2.21",
    "ruff>=0.7.0",
]

[project.scripts]
drover-api = "drover.main:run"
drover-worker = "drover.worker:main"
drover-migrate = "drover.scripts.migrate:main"

[tool.hatch.metadata]
allow-direct-references = true


[tool.hatch.build.targets.wheel]
packages = ["drover"]

[tool.hatch.build.targets.wheel.shared-data]
"deploy/kolla/ansible/roles/drover" = "share/kolla-ansible/ansible/roles/drover"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: Live OpenStack and Drover integration tests requiring DROVER_INTEGRATION_CLOUD=1",
]
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "B904", "SIM103", "SIM105", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B", "SIM", "E402"]
