---
- name: Source Build | Ensure Drover source checkout directory exists
  become: true
  ansible.builtin.file:
    path: "{{ drover_source_dir }}"
    state: directory
    mode: "0755"
  when: inventory_hostname in groups['drover']

- name: Source Build | Check if existing Git repository exists
  become: true
  ansible.builtin.stat:
    path: "{{ drover_source_dir }}/.git"
  register: drover_git_dir_stat
  when: inventory_hostname in groups['drover']

- name: Source Build | Check git status of existing checkout
  become: true
  ansible.builtin.command:
    cmd: "git status --porcelain"
    chdir: "{{ drover_source_dir }}"
  register: drover_existing_git_status
  changed_when: false
  when:
    - inventory_hostname in groups['drover']
    - drover_git_dir_stat.stat.exists

- name: Source Build | Fail if existing Drover checkout is dirty
  ansible.builtin.assert:
    that:
      - drover_existing_git_status.stdout | trim | length == 0
    fail_msg: "Existing Drover source checkout at {{ drover_source_dir }} is dirty (uncommitted changes present)"
  when:
    - inventory_hostname in groups['drover']
    - drover_git_dir_stat.stat.exists

- name: Source Build | Check HEAD SHA of existing checkout
  become: true
  ansible.builtin.command:
    cmd: "git rev-parse HEAD"
    chdir: "{{ drover_source_dir }}"
  register: drover_existing_head_sha
  changed_when: false
  when:
    - inventory_hostname in groups['drover']
    - drover_git_dir_stat.stat.exists

- name: Source Build | Fail if existing Drover checkout HEAD does not match drover_source_version
  ansible.builtin.assert:
    that:
      - drover_existing_head_sha.stdout | trim == drover_source_version
    fail_msg: "Existing Drover checkout HEAD ({{ drover_existing_head_sha.stdout | default('') }}) does not match required version ({{ drover_source_version }})"
  when:
    - inventory_hostname in groups['drover']
    - drover_git_dir_stat.stat.exists

- name: Source Build | Checkout Drover source repository when absent
  become: true
  ansible.builtin.git:
    repo: "{{ drover_source_repo }}"
    dest: "{{ drover_source_dir }}"
    version: "{{ drover_source_version }}"
    force: false
  when:
    - inventory_hostname in groups['drover']
    - not drover_git_dir_stat.stat.exists

- name: Source Build | Verify checked out HEAD SHA
  become: true
  ansible.builtin.command:
    cmd: "git rev-parse HEAD"
    chdir: "{{ drover_source_dir }}"
  register: drover_head_sha
  changed_when: false
  when: inventory_hostname in groups['drover']

- name: Source Build | Fail if checked out HEAD does not match drover_source_version
  ansible.builtin.assert:
    that:
      - drover_head_sha.stdout | trim == drover_source_version
    fail_msg: "Drover source checkout HEAD ({{ drover_head_sha.stdout | default('') }}) does not match expected version ({{ drover_source_version }})"
  when: inventory_hostname in groups['drover']

- name: Source Build | Build local Drover images
  become: true
  community.docker.docker_image:
    name: "afterglow-local/{{ item }}:{{ drover_source_version | truncate(12, True, '') }}"
    build:
      path: "{{ drover_source_dir }}"
      target: "{{ item }}"
    source: build
    force_source: false
  loop:
    - drover-api
    - drover-worker
  when: inventory_hostname in groups['drover']
