---
- name: Keystone | Register Drover service, project, and user
  ansible.builtin.import_role:
    name: service-ks-register
  vars:
    project_name: drover
    service_ks_register_auth: "{{ openstack_auth }}"
    service_ks_register_services:
      - name: drover
        type: drover
        description: "Drover K3s Kubernetes provisioning service"
        endpoints:
          - interface: public
            url: "{{ drover_public_endpoint_url }}"
          - interface: internal
            url: "{{ drover_internal_endpoint_url }}"
          - interface: admin
            url: "{{ drover_admin_endpoint_url }}"
    service_ks_register_users:
      - project: "{{ drover_service_project_name }}"
        user: "{{ drover_keystone_user }}"
        password: "{{ drover_keystone_password }}"
        role: admin
  no_log: true
