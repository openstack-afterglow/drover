---
# Drover kolla role defaults

drover_image_namespace: "ghcr.io/openstack-afterglow"
drover_image_tag: "v0.2.18"
drover_api_image: "{{ drover_image_namespace }}/drover-api"
drover_worker_image: "{{ drover_image_namespace }}/drover-worker"

drover_source_mode: "{{ enable_drover_source_build | default(enable_source_build | default(drover_dev_mode | default(false))) | bool }}"
drover_source_repo: "https://github.com/openstack-afterglow/drover.git"
drover_source_version: "eadb4c1d45e33e02718a005bc8fd174212cf713d"
drover_source_dir: "{{ drover_source_checkout_path | default('/opt/afterglow/src/drover') }}"
drover_api_image_ref: "{{ 'afterglow-local/drover-api:' ~ (drover_source_version | truncate(12, True, '')) if (drover_source_mode | bool) else (drover_api_image ~ ':' ~ drover_image_tag) }}"
drover_worker_image_ref: "{{ 'afterglow-local/drover-worker:' ~ (drover_source_version | truncate(12, True, '')) if (drover_source_mode | bool) else (drover_worker_image ~ ':' ~ drover_image_tag) }}"

enable_drover: "no"
enable_drover_api: "{{ enable_drover }}"
enable_drover_worker: "{{ enable_drover }}"
drover_run_preconditions: true

drover_api_port: 8011
drover_api_listen_address: "{{ 'api' | kolla_address(inventory_hostname) }}"
drover_api_listen_port: 18011
drover_database_name: "drover"
drover_database_user: "drover"
drover_database_address: "{{ database_address }}"
drover_database_port: "{{ database_port }}"
drover_database_admin_user: "{{ database_user }}"
drover_database_admin_password: "{{ database_password }}"
drover_database_url: "mysql+aiomysql://{{ drover_database_user }}@{{ drover_database_address }}:{{ drover_database_port }}/{{ drover_database_name }}"
drover_valkey_host: "{{ 'api' | kolla_address(groups['valkey'][0]) }}"
drover_valkey_port: "{{ valkey_server_port }}"
drover_valkey_password: "{{ valkey_master_password }}"
drover_redis_db_index: 7
drover_redis_url: "redis://{{ drover_valkey_host }}:{{ drover_valkey_port }}/{{ drover_redis_db_index }}"

drover_secrets_dir: "{{ drover_config_dir }}/secrets"
drover_container_secrets_dir: "/etc/drover/secrets"
drover_keystone_password_file: "{{ drover_container_secrets_dir }}/os_password"
drover_database_password_file: "{{ drover_container_secrets_dir }}/database_password"
drover_redis_password_file: "{{ drover_container_secrets_dir }}/redis_password"
drover_kubeconfig_encryption_key_file: "{{ drover_container_secrets_dir }}/kubeconfig_encryption_key"

drover_keystone_user: "drover"
drover_keystone_auth_url: "{{ keystone_internal_url }}"
drover_keystone_project_domain_name: "{{ default_project_domain_name }}"
drover_keystone_user_domain_name: "{{ default_user_domain_name }}"
drover_keystone_region_name: "{{ openstack_region_name }}"
drover_keystone_interface: "{{ openstack_interface | default('internal') }}"
drover_service_project_name: "drover-service"
drover_service_project_id: ""  # config tasks resolve the concrete ID before rendering
drover_external_url: "{{ public_protocol | default('https') }}://{{ kolla_external_fqdn | default('localhost') }}:{{ drover_api_port }}"
drover_callback_base_url: "{{ drover_external_url }}"
drover_public_endpoint_url: "{{ drover_external_url }}"
drover_internal_endpoint_url: "{{ internal_protocol | default('http') }}://{{ kolla_internal_fqdn | default(kolla_internal_vip_address) }}:{{ drover_api_port }}"
drover_admin_endpoint_url: "{{ drover_internal_endpoint_url }}"

# Optional Kolla external-VIP route. Keep drover-api internal so the internal
# and admin Keystone endpoints remain available on the internal VIP.
drover_public_haproxy_enabled: false
drover_public_haproxy_fqdn: ""

drover_kubeconfig_encryption_key: "{{ afterglow_kubeconfig_encryption_key | default('') }}"

drover_boot_volume_size_gb: 30

drover_occm_enabled: false
drover_occm_image: "registry.k8s.io/provider-os/openstack-cloud-controller-manager:v1.34.1"

drover_cinder_csi_enabled: false
drover_cinder_csi_image: "registry.k8s.io/provider-os/cinder-csi-plugin:v1.34.1"

drover_manila_csi_enabled: false
drover_manila_csi_image: "registry.k8s.io/provider-os/manila-csi-plugin:v1.34.1"
drover_manila_csi_nfs_image: "registry.k8s.io/sig-storage/nfsplugin:v4.9.0"
drover_manila_csi_share_protocol: "NFS"

drover_keystone_auth_enabled: false
drover_keystone_auth_image: "registry.k8s.io/provider-os/k8s-keystone-auth:v1.34.1"
drover_keystone_auth_policy: ""

drover_octavia_ingress_enabled: false
drover_octavia_ingress_image: "registry.k8s.io/provider-os/octavia-ingress-controller:v1.34.1"

drover_barbican_kms_enabled: false
drover_barbican_kms_image: "registry.k8s.io/provider-os/barbican-kms-plugin:v1.34.1"
drover_barbican_kms_kek_id: ""

drover_cert_rotation_node_timeout_sec: 300
drover_cert_rotation_job_image: "registry.k8s.io/util-linux/util-linux:latest"

drover_stampede_enabled: false
drover_stampede_interval: 60
drover_stampede_scale_down_threshold: 0.5
drover_stampede_scale_down_window: 600
drover_stampede_scale_up_cooldown: 120
drover_stampede_scale_down_cooldown: 300
drover_stampede_resource_headroom_factor: 0.3

drover_services:
  drover-api:
    container_name: drover_api
    group: drover
    enabled: "{{ enable_drover_api | bool }}"
    image: "{{ drover_api_image_ref }}"
    network_mode: host
    command: ["uvicorn", "drover.main:app", "--host", "{{ drover_api_listen_address }}", "--port", "{{ drover_api_listen_port | string }}"]
    restart_policy: unless-stopped
    volumes:
      - "{{ drover_config_dir }}/drover.conf:/app/drover.conf:ro"
      - "{{ drover_secrets_dir }}:{{ drover_container_secrets_dir }}:ro"
      - "kolla_logs:/var/log/kolla/"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; response = urlopen('http://{{ drover_api_listen_address }}:{{ drover_api_listen_port }}/v1/health', timeout=5); assert response.status == 200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    haproxy:
      drover-api:
        enabled: "{{ enable_drover_api | bool }}"
        external: false
        port: "{{ drover_api_port }}"
        listen_port: "{{ drover_api_listen_port }}"
        host_group: drover
        frontend_http_extra:
          - "option forwardfor"
        backend_http_extra:
          - "option httpchk GET /v1/health"
          - "http-check expect status 200"

  drover-worker:
    container_name: drover_worker
    group: drover
    enabled: "{{ enable_drover_worker | bool }}"
    image: "{{ drover_worker_image_ref }}"
    command: ["python", "-m", "drover.worker"]
    network_mode: host
    restart_policy: unless-stopped
    volumes:
      - "{{ drover_config_dir }}/drover.conf:/app/drover.conf:ro"
      - "{{ drover_secrets_dir }}:{{ drover_container_secrets_dir }}:ro"
      - "kolla_logs:/var/log/kolla/"

drover_service_environments:
  drover-api:
    DATABASE_URL: "{{ drover_database_url }}"
    REDIS_URL: "{{ drover_redis_url }}"
  drover-worker:
    DATABASE_URL: "{{ drover_database_url }}"
    REDIS_URL: "{{ drover_redis_url }}"

drover_public_haproxy_services:
  drover-public:
    group: drover
    enabled: "{{ enable_drover_api | bool and drover_public_haproxy_enabled | bool }}"
    haproxy:
      drover-public:
        enabled: "{{ enable_drover_api | bool and drover_public_haproxy_enabled | bool }}"
        external: true
        external_fqdn: "{{ drover_public_haproxy_fqdn }}"
        mode: http
        with_frontend: true
        with_backend: true
        host_group: drover
        port: "{{ drover_api_port }}"
        listen_port: "{{ drover_api_listen_port }}"
        frontend_http_extra:
          - "option forwardfor"
        backend_http_extra:
          - "option httpchk GET /v1/health"
          - "http-check expect status 200"

drover_haproxy_services: "{{ drover_services | combine(drover_public_haproxy_services, recursive=True) }}"
