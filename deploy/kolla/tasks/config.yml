---
# Configuration tasks for Drover services

- name: Ensure Kolla config directories exist
  ansible.builtin.file:
    path: "{{ node_config_directory }}/{{ item.key }}"
    state: directory
    owner: "{{ config_owner_user | default('root') }}"
    group: "{{ config_owner_group | default('root') }}"
    mode: "0750"
  with_dict: "{{ drover_services }}"
  when:
    - inventory_hostname in groups[item.value.group] | default([])
    - item.value.enabled | bool

- name: Render container config.json files
  ansible.builtin.template:
    src: "{{ item.key }}.json.j2"
    dest: "{{ node_config_directory }}/{{ item.key }}/config.json"
    owner: "{{ config_owner_user | default('root') }}"
    group: "{{ config_owner_group | default('root') }}"
    mode: "0600"
  with_dict: "{{ drover_services }}"
  when:
    - inventory_hostname in groups[item.value.group] | default([])
    - item.value.enabled | bool

- name: Render drover.conf
  ansible.builtin.template:
    src: "drover.conf.j2"
    dest: "{{ node_config_directory }}/{{ item.key }}/drover.conf"
    owner: "{{ config_owner_user | default('root') }}"
    group: "{{ config_owner_group | default('root') }}"
    mode: "0600"
  with_dict: "{{ drover_services }}"
  when:
    - inventory_hostname in groups[item.value.group] | default([])
    - item.value.enabled | bool

- name: Render policy.yaml
  ansible.builtin.template:
    src: "policy.yaml.j2"
    dest: "{{ node_config_directory }}/{{ item.key }}/policy.yaml"
    owner: "{{ config_owner_user | default('root') }}"
    group: "{{ config_owner_group | default('root') }}"
    mode: "0600"
  with_dict: "{{ drover_services }}"
  when:
    - inventory_hostname in groups[item.value.group] | default([])
    - item.value.enabled | bool

- name: Ensure secret directory exists on host
  ansible.builtin.file:
    path: "{{ drover_secret_dir }}"
    state: directory
    owner: "{{ config_owner_user | default('root') }}"
    group: "{{ config_owner_group | default('root') }}"
    mode: "0700"
  when:
    - inventory_hostname in groups['drover-api'] | default([]) or inventory_hostname in groups['drover-worker'] | default([])

- name: Render secret files to host secret directory
  ansible.builtin.copy:
    content: "{{ item.content }}\n"
    dest: "{{ drover_secret_dir }}/{{ item.name }}"
    owner: "{{ config_owner_user | default('root') }}"
    group: "{{ config_owner_group | default('root') }}"
    mode: "0600"
  loop:
    - { name: "os_password", content: "{{ drover_keystone_password }}" }
    - { name: "database_password", content: "{{ drover_database_password }}" }
    - { name: "redis_password", content: "{{ drover_redis_password }}" }
    - { name: "kubeconfig_encryption_key", content: "{{ drover_kubeconfig_encryption_key }}" }
  when:
    - inventory_hostname in groups['drover-api'] | default([]) or inventory_hostname in groups['drover-worker'] | default([])
    - item.content | length > 0
