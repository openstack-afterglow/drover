---
# Database migration gate task: runs `drover-migrate` container before workload admission.
# Must execute and exit 0 before drover-api or drover-worker are started.

- name: Run Drover schema migration job
  community.docker.docker_container:
    name: "drover_migrate"
    image: "{{ drover_services['drover-migrate'].image }}"
    state: started
    detach: false
    auto_remove: true
    volumes: "{{ drover_services['drover-migrate'].volumes }}"
    env: "{{ drover_services['drover-migrate'].environment }}"
  register: drover_migration_result
  when:
    - inventory_hostname in groups[drover_services['drover-migrate'].group] | default([])
    - drover_services['drover-migrate'].enabled | bool
    - inventory_hostname == (groups[drover_services['drover-migrate'].group] | default([inventory_hostname]))[0]

- name: Verify schema migration completion
  ansible.builtin.assert:
    that:
      - drover_migration_result is succeeded
    fail_msg: "Drover schema migration failed. Workload admission blocked."
  when:
    - inventory_hostname in groups[drover_services['drover-migrate'].group] | default([])
    - drover_services['drover-migrate'].enabled | bool
    - inventory_hostname == (groups[drover_services['drover-migrate'].group] | default([inventory_hostname]))[0]
