---
# Keystone service catalog registration tasks for Drover.
#
# Performs:
# 1. Keystone service user creation and admin role assignment.
# 2. Collision guard checking for existing container-infra service (e.g. Magnum).
# 3. Idempotent registration and atomic catalog replacement for Drover endpoints (/v1).

- name: Create Drover Keystone service user
  openstack.cloud.identity_user:
    auth: "{{ drover_openstack_auth }}"
    ca_cert: "{{ drover_openstack_cacert | default(omit) }}"
    interface: "{{ drover_keystone_interface }}"
    state: present
    name: "{{ drover_keystone_username }}"
    password: "{{ drover_keystone_password }}"
    domain: "{{ drover_keystone_user_domain_name }}"
    default_project: "{{ drover_keystone_project_name }}"
  when:
    - inventory_hostname in groups[drover_services['drover-api'].group] | default([])
    - inventory_hostname == (groups[drover_services['drover-api'].group] | default([inventory_hostname]))[0]

- name: Grant admin role to Drover service user
  openstack.cloud.role_assignment:
    auth: "{{ drover_openstack_auth }}"
    ca_cert: "{{ drover_openstack_cacert | default(omit) }}"
    interface: "{{ drover_keystone_interface }}"
    state: present
    user: "{{ drover_keystone_username }}"
    role: "{{ drover_keystone_admin_role }}"
    project: "{{ drover_keystone_project_name }}"
    user_domain: "{{ drover_keystone_user_domain_name }}"
    project_domain: "{{ drover_keystone_project_domain_name }}"
  when:
    - inventory_hostname in groups[drover_services['drover-api'].group] | default([])
    - inventory_hostname == (groups[drover_services['drover-api'].group] | default([inventory_hostname]))[0]

- name: Query existing Keystone services for container-infra
  openstack.cloud.identity_service_info:
    auth: "{{ drover_openstack_auth }}"
    ca_cert: "{{ drover_openstack_cacert | default(omit) }}"
    interface: "{{ drover_keystone_interface }}"
    type: "{{ drover_keystone_service_type }}"
  register: existing_container_infra_services
  when:
    - inventory_hostname in groups[drover_services['drover-api'].group] | default([])
    - inventory_hostname == (groups[drover_services['drover-api'].group] | default([inventory_hostname]))[0]

- name: Verify Magnum catalog collision guard
  ansible.builtin.assert:
    that:
      - (existing_container_infra_services.openstack_services | default([]) | selectattr('name', 'ne', drover_keystone_service_name) | list | length == 0)
    fail_msg: "An existing service of type '{{ drover_keystone_service_type }}' (e.g. Magnum) was found in the Keystone catalog under a different service name. Automatic catalog replacement is unsupported because Keystone identity services cannot be atomically renamed or rebound via Ansible openstack.cloud modules. Manual catalog migration is required: remove the existing '{{ drover_keystone_service_type }}' service catalog entry before registering Drover."
  when:
    - inventory_hostname in groups[drover_services['drover-api'].group] | default([])
    - inventory_hostname == (groups[drover_services['drover-api'].group] | default([inventory_hostname]))[0]

- name: Create or update Drover Keystone service entry
  openstack.cloud.identity_service:
    auth: "{{ drover_openstack_auth }}"
    ca_cert: "{{ drover_openstack_cacert | default(omit) }}"
    interface: "{{ drover_keystone_interface }}"
    state: present
    name: "{{ drover_keystone_service_name }}"
    service_type: "{{ drover_keystone_service_type }}"
    description: "{{ drover_keystone_service_description }}"
    enabled: true
  register: drover_keystone_service
  when:
    - inventory_hostname in groups[drover_services['drover-api'].group] | default([])
    - inventory_hostname == (groups[drover_services['drover-api'].group] | default([inventory_hostname]))[0]

- name: Register Drover public, internal, and admin endpoints (/v1)
  openstack.cloud.endpoint:
    auth: "{{ drover_openstack_auth }}"
    ca_cert: "{{ drover_openstack_cacert | default(omit) }}"
    interface: "{{ item.interface }}"
    state: present
    service: "{{ drover_keystone_service_name }}"
    endpoint_interface: "{{ item.interface }}"
    url: "{{ item.url }}"
    region: "{{ drover_keystone_region }}"
    enabled: true
  loop:
    - { interface: "public", url: "{{ drover_public_endpoint }}" }
    - { interface: "internal", url: "{{ drover_internal_endpoint }}" }
    - { interface: "admin", url: "{{ drover_admin_endpoint }}" }
  when:
    - inventory_hostname in groups[drover_services['drover-api'].group] | default([])
    - inventory_hostname == (groups[drover_services['drover-api'].group] | default([inventory_hostname]))[0]
