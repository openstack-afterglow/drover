---
# Kolla-Ansible default configuration for Drover service

# Service enablement & container definitions
drover_services:
  drover-api:
    container_name: drover_api
    group: drover-api
    enabled: true
    image: "{{ drover_api_image_full }}"
    environment:
      DROVER_CONFIG_FILE: "/etc/drover/drover.conf"
    volumes: "{{ drover_api_default_volumes + drover_api_extra_volumes }}"
    dimensions: "{{ drover_api_dimensions }}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:{{ drover_api_port }}/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    readiness_check:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:{{ drover_api_port }}/v1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
  drover-worker:
    container_name: drover_worker
    group: drover-worker
    enabled: true
    image: "{{ drover_worker_image_full }}"
    environment:
      DROVER_CONFIG_FILE: "/etc/drover/drover.conf"
    volumes: "{{ drover_worker_default_volumes + drover_worker_extra_volumes }}"
    dimensions: "{{ drover_worker_dimensions }}"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python -m drover.worker' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
  drover-migrate:
    container_name: drover_migrate
    group: drover-api
    enabled: true
    image: "{{ drover_migrate_image_full }}"
    environment:
      DROVER_CONFIG_FILE: "/etc/drover/drover.conf"
    volumes: "{{ drover_migrate_default_volumes + drover_migrate_extra_volumes }}"
    dimensions: "{{ drover_migrate_dimensions }}"

# Images
drover_tag: "latest"
drover_api_image: "{{ docker_registry | default('localhost:5000') }}/{{ docker_namespace | default('openstack.kolla') }}/drover-api"
drover_api_image_full: "{{ drover_api_image }}:{{ drover_tag }}"
drover_worker_image: "{{ docker_registry | default('localhost:5000') }}/{{ docker_namespace | default('openstack.kolla') }}/drover-worker"
drover_worker_image_full: "{{ drover_worker_image }}:{{ drover_tag }}"
drover_migrate_image: "{{ drover_api_image }}"
drover_migrate_image_full: "{{ drover_migrate_image }}:{{ drover_tag }}"

# Container Dimensions
default_container_dimensions: {}
drover_api_dimensions: "{{ default_container_dimensions }}"
drover_worker_dimensions: "{{ default_container_dimensions }}"
drover_migrate_dimensions: "{{ default_container_dimensions }}"

# Networking & Ports
drover_api_port: 8011
drover_api_listen_port: "{{ drover_api_port }}"

# Volume mounts & secret paths
drover_extra_volumes: []
drover_api_extra_volumes: "{{ drover_extra_volumes }}"
drover_worker_extra_volumes: "{{ drover_extra_volumes }}"
drover_migrate_extra_volumes: "{{ drover_extra_volumes }}"

node_config_directory: "/var/lib/kolla/config_files"
drover_secret_dir: "/etc/drover/secrets"

drover_api_default_volumes:
  - "{{ node_config_directory }}/drover-api/:/var/lib/kolla/config_files/:ro"
  - "/etc/localtime:/etc/localtime:ro"
  - "kolla_logs:/var/log/kolla/"
  - "{{ drover_secret_dir }}:/etc/drover/secrets:ro"

drover_worker_default_volumes:
  - "{{ node_config_directory }}/drover-worker/:/var/lib/kolla/config_files/:ro"
  - "/etc/localtime:/etc/localtime:ro"
  - "kolla_logs:/var/log/kolla/"
  - "{{ drover_secret_dir }}:/etc/drover/secrets:ro"

drover_migrate_default_volumes:
  - "{{ node_config_directory }}/drover-migrate/:/var/lib/kolla/config_files/:ro"
  - "/etc/localtime:/etc/localtime:ro"
  - "kolla_logs:/var/log/kolla/"
  - "{{ drover_secret_dir }}:/etc/drover/secrets:ro"

# Database configuration
drover_database_name: "drover"
drover_database_user: "drover"
drover_database_address: "{{ database_address | default('127.0.0.1') }}"
drover_database_port: "{{ database_port | default(3306) }}"
drover_database_password: "{{ secrets_drover_database_password | default('') }}"
drover_database_password_file: "/etc/drover/secrets/database_password"
drover_database_url: "mysql+aiomysql://{{ drover_database_user }}@{{ drover_database_address }}:{{ drover_database_port }}/{{ drover_database_name }}"

# Cache configuration
drover_redis_address: "{{ redis_address | default('127.0.0.1') }}"
drover_redis_port: "{{ redis_port | default(6379) }}"
drover_redis_password: "{{ secrets_redis_password | default('') }}"
drover_redis_password_file: "/etc/drover/secrets/redis_password"
drover_redis_db: 7
drover_redis_url: "redis://{{ drover_redis_address }}:{{ drover_redis_port }}/{{ drover_redis_db }}"

# Drover Service Parameters
drover_callback_base_url: "http://{{ kolla_external_fqdn | default(api_interface_address | default('127.0.0.1')) }}:{{ drover_api_port }}"
drover_policy_file: "/etc/drover/policy.yaml"
drover_policy_overrides: {}
drover_kubeconfig_encryption_key: "{{ secrets_drover_kubeconfig_encryption_key | default('') }}"
drover_kubeconfig_encryption_key_file: "/etc/drover/secrets/kubeconfig_encryption_key"
drover_boot_volume_size_gb: 30
drover_occm_enabled: true
drover_cinder_csi_enabled: true
drover_manila_csi_enabled: false
drover_k3s_health_interval: 180

drover_keystone_auth_url: "{{ keystone_internal_url | default('http://127.0.0.1:5000/v3') }}"
drover_keystone_username: "drover"
drover_keystone_password: "{{ secrets_drover_keystone_password | default('') }}"
drover_keystone_password_file: "/etc/drover/secrets/os_password"
drover_keystone_project_name: "service"
drover_keystone_project_domain_name: "Default"
drover_keystone_user_domain_name: "Default"
drover_keystone_region: "{{ openstack_region_name | default('RegionOne') }}"
drover_keystone_interface: "internal"
drover_keystone_insecure: false
drover_openstack_cacert: ""
drover_service_project_id: ""
drover_admin_legacy_project_policy: false

# Keystone Service Catalog Registration
drover_keystone_service_name: "drover"
drover_keystone_service_type: "container-infra"
drover_keystone_service_description: "Drover Container Infrastructure Service"
drover_keystone_admin_role: "admin"
# Collision guard: prevents registering Drover endpoints when a non-Drover container-infra service (e.g. Magnum) exists.
# Automatic in-place catalog replacement is unsupported because Keystone identity services cannot be atomically renamed or rebound via Ansible modules;
# manual catalog removal of Magnum ('openstack service delete magnum') is required before deployment.
drover_replace_magnum_catalog: false

# Endpoints (/v1)
drover_public_endpoint: "http://{{ kolla_external_fqdn | default(api_interface_address | default('127.0.0.1')) }}:{{ drover_api_port }}/v1"
drover_internal_endpoint: "http://{{ api_interface_address | default('127.0.0.1') }}:{{ drover_api_port }}/v1"
drover_admin_endpoint: "http://{{ api_interface_address | default('127.0.0.1') }}:{{ drover_api_port }}/v1"

# Callback security & MariaDB aliases
drover_callback_allowed_cidrs: []
drover_mariadb_address: "{{ drover_database_address }}"
drover_mariadb_port: "{{ drover_database_port }}"

# OpenStack authentication payload for openstack.cloud modules
drover_openstack_auth:
  auth_url: "{{ drover_keystone_auth_url }}"
  username: "{{ drover_keystone_username }}"
  password: "{{ drover_keystone_password }}"
  project_name: "{{ drover_keystone_project_name }}"
  project_domain_name: "{{ drover_keystone_project_domain_name }}"
  user_domain_name: "{{ drover_keystone_user_domain_name }}"
